<h1>Обход компактного города</h1><p>Ровно 7 снимков. Все 15 районов посещены обычными WASD-командами на настоящем локальном сервере; координаты сверены с SQLite. Это журнал проверки, включая найденные дефекты.</p><p><a href="walk.json">Маршрут и авторитетные координаты</a>. Автоматические screenshot, trace и video отключены.</p>
<figure><img src="1-market.png" alt="Рынок"><figcaption>1. Рынок. Существующая геометрия сохранена.</figcaption></figure>
<figure><img src="2-bakery-mill.png" alt="Мельница"><figcaption>2. Мельница: жернова, ослик, мешки, корзины, весы, таблички и детали фасадов.</figcaption></figure>
<figure><img src="3-garden-homes.png" alt="Жилой квартал"><figcaption>3. Жилой квартал. В исходном кадре виден декоративный горизонт внутри города — дефект исправлен.</figcaption></figure>
<figure><img src="4-palace-gardens.png" alt="Дефект горизонта"><figcaption>4. Сады до исправления: декоративные горы перекрывали камеру. Сохранено как свидетельство дефекта.</figcaption></figure>
<figure><img src="5-school-dye.png" alt="Красильня"><figcaption>5. Красильня до исправления горизонта: чаны, ткань, ткацкий станок и сосуды.</figcaption></figure>
<figure><img src="6-gardens-fixed.png" alt="Исправленные сады"><figcaption>6. Сады после переноса декоративных гор за северную границу. Камера и проход свободны.</figcaption></figure>
<figure><img src="7-map-390.png" alt="Карта на узком экране"><figcaption>7. Карта 390×844 до исправления обрезки общего обзора. После исправления размеры проверены в браузере на 390 и 1920 px без нового снимка.</figcaption></figure>
